<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title lang="en">yoojiye web</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="header-inner page-grid">
      <button class="header-home-button" id="home-button" type="button" lang="en">
        Yoo Jiye
      </button>
    </div>
  </header>

  <main>
    <section class="slideshow" aria-label="Portfolio images">
      <div class="slide-media" id="slide-media"></div>

      <div class="slide-caption page-grid">
        <div class="slide-title" id="slide-title"></div>
      </div>
    </section>
  </main>

  <aside class="floating-contact page-grid" aria-label="Contact">
    <div class="floating-contact-content" id="floating-contact-content" lang="en"></div>
  </aside>

  <script src="js/script.js"></script>
</body>

</html>
